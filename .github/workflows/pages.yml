name: Verify and publish Go Foundry
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: go-foundry-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: |
            .cache/sdk
            .cache/local-linux
            .cache/*tar*
            .build/site/runtime
            .build/site/linux/releases
          key: go-image-${{ runner.os }}-${{ hashFiles('tools/local-linux/**', 'tools/go-toolchain.json', 'cmd/**', 'internal/**', 'go.mod', 'run', 'README.md', 'THIRD_PARTY.md', 'LICENSE') }}
          restore-keys: go-image-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
      - name: Run the real Go tests on the native reference host
        run: GOTOOLCHAIN=local CGO_ENABLED=0 GOAMD64=v1 GOMAXPROCS=2 GOCACHE="$PWD/.cache/test-cache" .cache/sdk/go/bin/go test -trimpath -count=1 -p=1 ./...
      - run: npm test
      - name: Select browser
        run: |
          if command -v google-chrome > /dev/null; then
            printf 'CHROMIUM_PATH=%s\n' "$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:browser
      - run: npm run test:navigation
      - name: Verify readable original concept models
        run: npm run test:visuals
      - uses: actions/upload-artifact@v4
        with:
          name: verified-site
          path: .build/site
          retention-days: 3
  starters:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lab: [first-programs, values-and-types, conditions-and-loops, functions-and-pointers, collections-and-text, types-and-interfaces, errors-and-testing, files-and-http, concurrency, data-structures, algorithms, tinydb]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: .build/site
      - name: Select browser
        run: echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Execute each starter in real browser Linux
        run: node tests/self-hosted-linux.cjs go --lab ${{ matrix.lab }} --examples-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-${{ matrix.lab }}
          path: test-results
          retention-days: 3
  runner:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: .build/site
      - name: Select browser
        run: echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Verify edits, errors, cancellation, saved project and fresh VM recovery
        run: node tests/self-hosted-linux.cjs go --runner-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guest-runner-recovery
          path: test-results
          retention-days: 3
  package:
    if: github.ref == 'refs/heads/main'
    needs: [verify, starters, runner]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: verified-site
          path: .build/site
      - name: Preserve cached HTML compatibility
        run: node tools/retain-frontend.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
